[tool.poetry]
name = "django-rbaca"
version = "1.2.5"
description = "Role-based access control with attributes for Django"
authors = ["Steven Bruch", "Mickael Cormier", "Lukas Möhlenkamp-Röttger"]
readme = "README.md"
packages = [{include = "rbaca"}]

[tool.poetry.dependencies]
python = "^3.11"
django = [
	{version = ">=4.2, <5.3", python = ">=3.11, <3.12"},
	{version = ">=4.2, <6.2", python = ">=3.12, <4.0"},
]
djangorestframework = ">=3.15, <4.0"
drf-jwt = "^1.19.2"
sphinx = "^7.3.7"
sphinx-rtd-theme = "^1.3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.4.0"
black = "26.10.1"
djlint = "^1.34.0"
isort = "^5.12.0"
safety = "^2.3.5"
flake8 = "^6.1.0"
coverage = "7.4.3"
marshmallow = "<4.0"
setuptools = "^84.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
